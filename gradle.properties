# ============================================================
# Deepslate — single source of truth for global build settings.
# Do NOT duplicate these values in build.gradle or in
# versions/<version>/gradle.properties: everything lives here.
# ============================================================

# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Groovy DSL is used deliberately (see settings.gradle)
dev.kikugie.stonecutter.hard_mode=true

# Mod metadata (expanded into fabric.mod.json by processResources)
mod.id=deepslate
mod.version=1.0.0
mod.name=Deepslate
mod.description=This is an example description!
mod.authors=N1zyyy
mod.license=CC0-1.0
mod.homepage=https://fabricmc.net/
mod.sources=https://github.com/FabricMC/fabric-example-mod
mod.icon=assets/deepslate/icon.png
group=net.n1zy

# Toolchain
java.version=25
loom_version=1.19-SNAPSHOT

# Shared dependencies
deps.fabric_loader=0.20.1

# ------------------------------------------------------------
# Per-node values: <key>.<minecraft version>
# Add the same keys for every version listed in settings.gradle.
# ------------------------------------------------------------

# Minecraft 26.1.2
deps.fabric_api.26.1.2=0.155.3+26.1.2
deps.minecraft_range.26.1.2=>=26.1 <26.2

# Minecraft 26.2
deps.fabric_api.26.2=0.161.0+26.2
deps.minecraft_range.26.2=>=26.2 <26.3

# Minecraft 26.3
deps.fabric_api.26.3=0.166.2+26.3
deps.minecraft_range.26.3=>=26.3 <26.4
