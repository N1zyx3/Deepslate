plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// All global settings live in the root gradle.properties.
def prop = { String name ->
	def value = findProperty(name)
	if (value == null) {
		throw new GradleException("Missing property '${name}' in gradle.properties")
	}
	value.toString()
}

def mcVersion = sc.current.version
def modId = prop('mod.id')
def modVersion = prop('mod.version')
def javaVersion = prop('java.version') as int

// Per-node values are stored in the root gradle.properties as <key>.<minecraft version>
def nodeProp = { String name -> prop("${name}.${mcVersion}") }

def minecraftRange = nodeProp('deps.minecraft_range')

// Produces {mod.id}-{mod.version}+{minecraft version}.jar for every node
version = "${modVersion}+${mcVersion}"
base.archivesName = modId

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	// Loom expects fabric.mod.json in each version project; point it at the shared one.
	fabricModJsonPath = rootProject.file('src/main/resources/fabric.mod.json')

	mods {
		"${modId}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = modId
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${mcVersion}"
	implementation "net.fabricmc:fabric-loader:${prop('deps.fabric_loader')}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${nodeProp('deps.fabric_api')}"
}

processResources {
	def expandProperties = [
		"version"        : project.version,
		"mod_id"         : modId,
		"mod_name"       : prop('mod.name'),
		"mod_description": prop('mod.description'),
		"mod_authors"    : prop('mod.authors'),
		"mod_license"    : prop('mod.license'),
		"mod_homepage"   : prop('mod.homepage'),
		"mod_sources"    : prop('mod.sources'),
		"mod_icon"       : prop('mod.icon'),
		"fabric_loader"  : prop('deps.fabric_loader'),
		"java_version"   : javaVersion,
		"minecraft_range": minecraftRange,
	]
	inputs.properties expandProperties

	filesMatching("fabric.mod.json") {
		expand expandProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	from("LICENSE") {
		rename { "${it}_$modId"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
